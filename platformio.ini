; ============================================================================
; PlatformIO 构建入口 —— 与 Arduino IDE / arduino-cli 共用同一份源码
;
; src_dir 直接指向 Arduino sketch 目录，PlatformIO 会把 .ino 自动当 .cpp 编译
; 并补上函数原型（core 的 ConvertInoToCpp），所以 peristaltic_pump/ 里
; 不需要移动或改名任何文件，IDE 那条构建路径保持可用。
;
;   pio run                  编译
;   pio run -t upload        烧录
;   pio run -t size          看 flash / RAM 占用
;   pio device monitor       115200
; ============================================================================

[platformio]
src_dir = peristaltic_pump
default_envs = esp32s3

[env:esp32s3]
; Arduino core 3.3.11 (ESP-IDF 5.5.5) —— 与本机 Arduino IDE 实测通过的 core 同版本，
; 编译结果才能和 README §4 记录的字节数对齐。
; 官方 platformio/espressif32 目前只带 core 2.0.17（IDF 4.4），编不过这份 3.x 代码。
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
; 板子就是 N16R8：这份 board 定义自带 16MB flash + qio_opi（-DBOARD_HAS_PSRAM、
; psram_type=opi），不要退回 esp32-s3-devkitc-1 —— 那颗是 N8（无 PSRAM），
; 缓冲区会全部落回内部 SRAM，而且 pioarduino 判断 PSRAM 只看 board 的
; extra_flags/sdkconfig，不看 memory_type，配 memory_type 也救不回来。
board = esp32-s3-devkitc1-n16r8

; 对齐 README §4 的 IDE 选项：Partition Scheme 必须 Huge APP（3MB，无 OTA）
board_build.partitions = huge_app.csv

; USB CDC On Boot: Disabled —— Serial 走 UART0(GPIO43/44)，GPIO21/47 是独立的 Hardware UART。
; 不显式定义的话值取决于 board json，这里钉死，免得换 board 后串口悄悄变了。
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

; 版本与 README §4 实测记录一致，逐个钉死。
; FastAccelStepper 停在 1.2.7：1.4.0（本机 Arduino 库目录里那份）在这条路径上编不过 ——
; esp32_queue.cpp:647 的 SUPPORT_ESP32_RMT_SYNC 分支用 rmt_new_sync_manager(&chan, n, &mgr)
; 调用签名是 (const rmt_sync_manager_config_t*, rmt_sync_manager_handle_t*) 的接口，
; 还引用了未声明的 rmt_sync_manager_add_channel() / _del_channel()。
; 注意：同一天 arduino-cli + 本机同一个 core 3.3.11 编 1.4.0 是通过的，成因未查，
; 别把这条限制当成「1.4.0 在任何构建下都坏」。
lib_deps =
    gin66/FastAccelStepper@1.2.7
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit NeoPixel@1.15.5

monitor_speed = 115200
