name: Compile Firmware

on:
  push:
    branches: [master, tmc2226]
  pull_request:
    branches: [master, tmc2226]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR="$HOME/bin" sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core (3.3.10)
        run: |
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install libraries
        run: arduino-cli lib install ArduinoJson FastAccelStepper "Adafruit NeoPixel"

      - name: Compile firmware
        run: |
          # Arduino 要求草图文件夹名与 .ino 同名; runner 上 checkout 目录是仓库名
          # (peristaltic-pump), 因此先复制到名称匹配的目录再编译
          mkdir -p "$RUNNER_TEMP/sketch/peristaltic_pump_TMC2226"
          cp ./*.ino ./*.h ./*.cpp "$RUNNER_TEMP/sketch/peristaltic_pump_TMC2226/"
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,PartitionScheme=huge_app,FlashSize=16M,CPUFreq=160,USBMode=hwcdc" \
            "$RUNNER_TEMP/sketch/peristaltic_pump_TMC2226"
